<section class="how-it-works" id="how-it-works">
    <h2>How it works</h2>
    <ol class="steps">
        <li class="step">Build a grid of every viewer against every film they've rated.</li>
        <li class="step">Compare tastes between viewers using cosine similarity.</li>
        <li class="step">Find the viewers whose tastes are closest to yours.</li>
        <li class="step">Rank the films those close viewers rated highly.</li>
    </ol>
</section>
