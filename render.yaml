services:
  - type: web
    name: movie-recommendation-system
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt && python scripts/fetch_data.py && python scripts/load_database.py && python scripts/train_model.py
    startCommand: gunicorn wsgi:app --bind 0.0.0.0:$PORT
    healthCheckPath: /health
    envVars:
      - key: APP_ENV
        value: production
      - key: SECRET_KEY
        generateValue: true
